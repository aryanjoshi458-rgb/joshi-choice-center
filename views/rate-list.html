    <!-- Toggle Button (Speak ke niche) -->
    <button id="sidebarToggle">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>

    <!-- VOICE + THEME CONTROLS -->

            <path d="M3 10v4h4l5 5V5L7 10H3z" />
        </svg>
        <span>Speak</span>

        <div class="celestial-sky-window"></div>
        <div class="celestial-knob-v4" id="celestialKnob"></div>
    </div>

    <main class="main">
        <header class="brand">
            <div class="brand-box">
                <div class="logo">JC</div>
                <h1 class="app-title" data-i18n="app-title">Joshi Choice Center</h1>
            </div>
        </header>

        <section class="rate-container">
            <div class="rate-header">
                <div class="header-main">
                    <h2 class="section-title">Manage Service Rates</h2>
                    <p class="section-desc">Configure pricing and automated charge rules for your center.</p>
                </div>
                <div class="header-actions">
                    <div class="view-toggle-group">
                        <button id="listViewBtn" class="view-btn active" title="List View">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                        <button id="gridViewBtn" class="view-btn" title="Grid View">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                    </div>
                    <button id="resetRatesBtn" class="aura-btn aura-btn-outline">Reset Defaults</button>
                    <button id="addRateBtn" class="aura-btn aura-btn-primary">+ Add New Service</button>
                </div>
            </div>

            <div class="rate-filters">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchRates" class="search-bar" placeholder="Search service or category...">
                </div>
                <div class="category-tabs" id="categoryTabs">
                    <button class="cat-tab active" data-category="all">All Services</button>
                    <!-- Tabs loaded by JS -->
                </div>
            </div>

            <div class="services-grid" id="servicesGrid">
                <!-- Cards loaded by JS -->
            </div>
        </section>
    </main>

    <!-- Modal for adding/editing -->
    <div id="rateModal" class="modal">
        <div class="modal-content premium-modal">
            <div class="modal-header">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </div>
                <div class="modal-title" id="modalTitle">Service Configuration</div>
            </div>
            
            <form id="rateForm" class="modal-body">
                <div class="form-section">
                    <label class="input-label">Service Information</label>
                    <div class="input-group">
                        <input type="text" id="serviceName" class="modal-input" placeholder="Service Name (e.g. Color Copy)">
                        <input type="text" id="serviceCategory" class="modal-input" placeholder="Category (e.g. Printing)">
                    </div>
                    <div class="input-group">
                        <input type="number" id="servicePrice" class="modal-input" placeholder="Base Price (₹)">
                    </div>
                </div>

                <div class="form-section">
                    <label class="input-label">Charge Configuration</label>
                    <div class="charge-mode-selector">
                        <select id="chargeType" class="modal-input">
                            <option value="fixed">Fixed Charge</option>
                            <option value="range">Range-based Charge</option>
                        </select>
                    </div>

                    <div id="fixedChargeContainer" class="charge-container">
                        <input type="number" id="serviceCharge" class="modal-input" placeholder="Default Charge Amount (₹)">
                    </div>

                    <div id="rangeChargeContainer" class="charge-container" style="display: none;">
                        <div id="rangeList" class="dynamic-range-list">
                            <!-- Ranges will be added here -->
                        </div>
                        <button type="button" id="addRangeBtn" class="add-range-trigger">
                            <span>+ Add New Price Slab</span>
                        </button>
                    </div>
                </div>

                <div class="modal-footer-actions">
                    <button type="button" id="cancelRateBtn" class="aura-btn aura-btn-outline">Cancel</button>
                    <button type="button" id="saveRateBtn" class="aura-btn aura-btn-primary">Apply Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastBox"></div>
    <div id="scrollArrow">▲</div>
